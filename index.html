```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HRMS Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="./css/style.css" />

</head>

<body>

  <!-- ── Login Screen ── -->
  <div id="loginScreen" class="login-screen">

    <div class="login-bg">
      <div class="login-blob b1"></div>
      <div class="login-blob b2"></div>
      <div class="login-blob b3"></div>
    </div>

    <div class="login-card">

      <div class="login-logo">

        <div class="logo-icon">
          <i class="fa-solid fa-building-columns"></i>
        </div>

        <h1>HRMS <span>Portal</span></h1>

        <p>Human Resource Management System</p>

      </div>

      <div class="tab-switcher">

        <button class="tab-btn active" onclick="switchLoginTab('employee', this)">
          Employee
        </button>

        <button class="tab-btn" onclick="switchLoginTab('admin', this)">
          Admin
        </button>

      </div>

      <div class="login-form">

        <div class="form-group">

          <label>
            <i class="fa-solid fa-envelope"></i>
            Email Address
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="you@company.com"
            autocomplete="off"
          />

        </div>

        <div class="form-group">

          <label>
            <i class="fa-solid fa-lock"></i>
            Password
          </label>

          <div class="pw-wrap">

            <input
              type="password"
              id="loginPassword"
              placeholder="••••••••"
            />

            <button class="pw-toggle" onclick="togglePw()">

              <i class="fa-solid fa-eye" id="pwIcon"></i>

            </button>

          </div>

        </div>

        <div id="loginError" class="login-error hidden"></div>

        <button
          class="btn-primary full-width"
          onclick="handleLogin()"
          id="loginBtn"
        >

          <span>Sign In</span>

          <i class="fa-solid fa-arrow-right"></i>

        </button>

        <div class="login-hint" id="loginHint">

          Demo: admin@hrms.com / admin123

        </div>

      </div>

    </div>

  </div>

  <!-- ── App Shell ── -->
  <div id="appShell" class="app-shell hidden">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">

        <div class="brand">

          <div class="brand-icon">
            <i class="fa-solid fa-building-columns"></i>
          </div>

          <div class="brand-text">

            <span class="brand-name">HRMS</span>

            <span class="brand-sub">Portal</span>

          </div>

        </div>

        <button class="sidebar-close" onclick="toggleSidebar()">

          <i class="fa-solid fa-xmark"></i>

        </button>

      </div>

      <div class="user-card">

        <div class="user-avatar" id="sidebarAvatar"></div>

        <div class="user-info">

          <div class="user-name" id="sidebarName">—</div>

          <div class="user-role" id="sidebarRole">—</div>

        </div>

      </div>

      <nav class="sidebar-nav">

        <div class="nav-section-label">Main</div>

        <a
          class="nav-item active"
          onclick="navigate('dashboard')"
          data-page="dashboard"
        >

          <i class="fa-solid fa-gauge-high"></i>

          <span>Dashboard</span>

        </a>

        <a
          class="nav-item"
          onclick="navigate('attendance')"
          data-page="attendance"
        >

          <i class="fa-solid fa-clock"></i>

          <span>Attendance</span>

        </a>

        <a
          class="nav-item"
          onclick="navigate('leaves')"
          data-page="leaves"
        >

          <i class="fa-solid fa-calendar-xmark"></i>

          <span>Leave Requests</span>

          <span
            class="badge"
            id="leavesBadge"
            style="display:none"
          ></span>

        </a>

        <div class="nav-section-label admin-only hidden">
          Management
        </div>

        <a
          class="nav-item admin-only hidden"
          onclick="navigate('employees')"
          data-page="employees"
        >

          <i class="fa-solid fa-users"></i>

          <span>Employees</span>

        </a>

        <a
          class="nav-item admin-only hidden"
          onclick="navigate('reports')"
          data-page="reports"
        >

          <i class="fa-solid fa-chart-bar"></i>

          <span>Reports</span>

        </a>

        <div class="nav-section-label">
          Account
        </div>

        <a
          class="nav-item"
          onclick="navigate('profile')"
          data-page="profile"
        >

          <i class="fa-solid fa-user-circle"></i>

          <span>My Profile</span>

        </a>

        <a
          class="nav-item logout-btn"
          onclick="handleLogout()"
        >

          <i class="fa-solid fa-right-from-bracket"></i>

          <span>Sign Out</span>

        </a>

      </nav>

    </aside>

    <!-- Overlay -->
    <div
      class="sidebar-overlay"
      id="sidebarOverlay"
      onclick="toggleSidebar()"
    ></div>

    <!-- Main -->
    <main class="main-content">

      <header class="topbar">

        <div class="topbar-left">

          <button class="hamburger" onclick="toggleSidebar()">

            <i class="fa-solid fa-bars"></i>

          </button>

          <div class="page-title" id="pageTitle">
            Dashboard
          </div>

        </div>

        <div class="topbar-right">

          <div class="topbar-time" id="topbarTime"></div>

          <div class="topbar-date" id="topbarDate"></div>

          <div class="topbar-user">

            <div class="topbar-avatar" id="topbarAvatar"></div>

          </div>

        </div>

      </header>

      <div class="content-area" id="contentArea">

        <!-- Pages render here -->

      </div>

    </main>

  </div>

  <script type="module" src="./js/app.js"></script>

</body>

</html>
```
