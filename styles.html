<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <style>
/* ═══════════════════════════════════════════════
   HRMS PORTAL — styles.html
   Design: Corporate Refined / Slate + Amber
═══════════════════════════════════════════════ */

:root {
  --bg         : #0f1117;
  --bg2        : #181c27;
  --bg3        : #1e2235;
  --surface    : #242840;
  --surface2   : #2d3254;
  --border     : rgba(255,255,255,.07);
  --border2    : rgba(255,255,255,.12);
  --primary    : #f59e0b;
  --primary-d  : #d97706;
  --primary-l  : #fcd34d;
  --accent     : #6366f1;
  --accent-d   : #4f46e5;
  --success    : #10b981;
  --danger     : #ef4444;
  --warning    : #f59e0b;
  --info       : #3b82f6;
  --text1      : #f0f2ff;
  --text2      : #9ca3af;
  --text3      : #6b7280;
  --sidebar-w  : 260px;
  --topbar-h   : 64px;
  --radius     : 14px;
  --radius-sm  : 8px;
  --shadow     : 0 4px 24px rgba(0,0,0,.4);
  --shadow-lg  : 0 12px 48px rgba(0,0,0,.5);
  --font       : 'DM Sans', sans-serif;
  --mono       : 'DM Mono', monospace;
  --trans      : .2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text1);
  min-height: 100vh;
  overflow-x: hidden;
}

.hidden { display: none !important; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }

/* ═══════════════════════════
   LOGIN
═══════════════════════════ */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 20% 50%, #1a1f35 0%, var(--bg) 60%);
}

.login-bg { position: absolute; inset: 0; pointer-events: none; }

.login-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .25;
  animation: blobFloat 8s ease-in-out infinite alternate;
}
.b1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; animation-delay: 0s; }
.b2 { width: 400px; height: 400px; background: var(--primary); bottom: -100px; right: -50px; animation-delay: -3s; }
.b3 { width: 300px; height: 300px; background: #06b6d4; top: 40%; left: 50%; animation-delay: -5s; }

@keyframes blobFloat {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(30px, -30px) scale(1.1); }
}

.login-card {
  position: relative;
  z-index: 1;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 2.5rem 2.75rem;
  width: min(420px, 92vw);
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.04);
  animation: slideUp .5s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.login-logo { text-align: center; margin-bottom: 1.75rem; }

.logo-icon {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
  font-size: 1.6rem;
  color: white;
  box-shadow: 0 8px 24px rgba(99,102,241,.4);
}

.login-logo h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -.5px; }
.login-logo h1 span { color: var(--primary); }
.login-logo p { color: var(--text3); font-size: .85rem; margin-top: .25rem; }

.tab-switcher {
  display: flex;
  background: var(--bg3);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 1.5rem;
  gap: 4px;
}

.tab-btn {
  flex: 1;
  padding: .5rem;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--text2);
  font-family: var(--font);
  font-size: .875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--trans);
}
.tab-btn.active {
  background: var(--surface);
  color: var(--text1);
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}

.form-group { margin-bottom: 1rem; }
.form-group label {
  display: flex;
  align-items: center;
  gap: .4rem;
  font-size: .8rem;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: .45rem;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.form-group label i { color: var(--primary); }

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: .7rem .9rem;
  color: var(--text1);
  font-family: var(--font);
  font-size: .9rem;
  outline: none;
  transition: border-color var(--trans), box-shadow var(--trans);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(245,158,11,.15);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--bg3); }

.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 2.8rem; }
.pw-toggle {
  position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text3); cursor: pointer; font-size: .9rem;
}

.login-error {
  background: rgba(239,68,68,.12);
  border: 1px solid rgba(239,68,68,.25);
  color: var(--danger);
  border-radius: var(--radius-sm);
  padding: .6rem .8rem;
  font-size: .85rem;
  margin-bottom: .75rem;
}

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  background: linear-gradient(135deg, var(--primary), var(--primary-d));
  color: #000;
  border: none;
  border-radius: 10px;
  padding: .75rem 1.25rem;
  font-family: var(--font);
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--trans);
  letter-spacing: .01em;
}
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(245,158,11,.35); }
.btn-primary:active { transform: translateY(0); }
.btn-primary.full-width { width: 100%; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  background: var(--surface);
  color: var(--text1);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: .65rem 1.2rem;
  font-family: var(--font);
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--trans);
}
.btn-secondary:hover { background: var(--surface2); border-color: var(--border2); }

.btn-danger {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  background: rgba(239,68,68,.15);
  color: var(--danger);
  border: 1px solid rgba(239,68,68,.25);
  border-radius: 10px;
  padding: .65rem 1.2rem;
  font-family: var(--font);
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--trans);
}
.btn-danger:hover { background: rgba(239,68,68,.25); }

.btn-success {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  background: rgba(16,185,129,.15);
  color: var(--success);
  border: 1px solid rgba(16,185,129,.25);
  border-radius: 10px;
  padding: .65rem 1.2rem;
  font-family: var(--font);
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--trans);
}
.btn-success:hover { background: rgba(16,185,129,.25); }

.login-hint {
  text-align: center;
  font-size: .78rem;
  color: var(--text3);
  margin-top: 1rem;
  font-family: var(--mono);
  background: var(--bg3);
  padding: .45rem .75rem;
  border-radius: 6px;
  border: 1px solid var(--border);
}

/* ═══════════════════════════
   APP SHELL
═══════════════════════════ */
.app-shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform var(--trans);
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: .75rem; }
.brand-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: .95rem; color: white;
}
.brand-name { display: block; font-size: .95rem; font-weight: 700; line-height: 1.1; }
.brand-sub  { display: block; font-size: .7rem; color: var(--text3); }

.sidebar-close { display: none; background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.1rem; padding: .25rem; }

.user-card {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 1rem;
  margin: .75rem .75rem 0;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.user-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; font-weight: 700; color: white;
  flex-shrink: 0;
}

.user-name { font-size: .875rem; font-weight: 600; }
.user-role {
  font-size: .72rem; color: var(--primary);
  text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
}

.sidebar-nav { padding: .75rem .75rem 1.5rem; flex: 1; }

.nav-section-label {
  font-size: .68rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 700;
  padding: 1rem .5rem .35rem;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .65rem .85rem;
  border-radius: 9px;
  color: var(--text2);
  cursor: pointer;
  transition: all var(--trans);
  margin-bottom: 2px;
  text-decoration: none;
  font-size: .875rem;
  font-weight: 500;
  position: relative;
}
.nav-item i { width: 18px; text-align: center; font-size: .9rem; flex-shrink: 0; }
.nav-item:hover { background: var(--surface); color: var(--text1); }
.nav-item.active {
  background: rgba(245,158,11,.12);
  color: var(--primary);
  font-weight: 600;
}
.nav-item.active i { color: var(--primary); }
.nav-item.logout-btn:hover { background: rgba(239,68,68,.1); color: var(--danger); }

.badge {
  margin-left: auto;
  background: var(--danger);
  color: white;
  font-size: .65rem;
  font-weight: 700;
  padding: .15rem .45rem;
  border-radius: 99px;
  min-width: 20px;
  text-align: center;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 99;
  backdrop-filter: blur(2px);
}

/* ── Topbar ── */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.topbar {
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  flex-shrink: 0;
}

.topbar-left { display: flex; align-items: center; gap: 1rem; }

.hamburger {
  display: none;
  background: none; border: none;
  color: var(--text2); cursor: pointer;
  font-size: 1.15rem; padding: .25rem;
  width: 36px; height: 36px;
  border-radius: 8px;
  align-items: center; justify-content: center;
  transition: background var(--trans);
}
.hamburger:hover { background: var(--surface); color: var(--text1); }

.page-title { font-size: 1.1rem; font-weight: 700; color: var(--text1); }

.topbar-right { display: flex; align-items: center; gap: 1rem; }

.topbar-time { font-size: 1rem; font-weight: 700; font-family: var(--mono); color: var(--text1); }
.topbar-date { font-size: .75rem; color: var(--text3); font-family: var(--mono); }

.topbar-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 700; color: white;
  cursor: pointer;
}

/* ── Content ── */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 1.75rem;
  animation: fadeIn .3s ease;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 1rem;
}
.page-header-left h2 { font-size: 1.4rem; font-weight: 700; }
.page-header-left p  { color: var(--text3); font-size: .85rem; margin-top: .2rem; }

/* ═══════════════════════════
   CARDS & STATS
═══════════════════════════ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  transition: border-color var(--trans), transform var(--trans);
}
.stat-card:hover { border-color: var(--border2); transform: translateY(-2px); }

.stat-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem;
  flex-shrink: 0;
}
.stat-icon.amber   { background: rgba(245,158,11,.15); color: var(--primary); }
.stat-icon.green   { background: rgba(16,185,129,.15); color: var(--success); }
.stat-icon.blue    { background: rgba(59,130,246,.15); color: var(--info); }
.stat-icon.purple  { background: rgba(99,102,241,.15); color: var(--accent); }
.stat-icon.red     { background: rgba(239,68,68,.15); color: var(--danger); }

.stat-val  { font-size: 1.75rem; font-weight: 700; line-height: 1; font-family: var(--mono); }
.stat-label { font-size: .78rem; color: var(--text3); margin-top: .3rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

/* ═══════════════════════════
   GRID LAYOUTS
═══════════════════════════ */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid var(--border);
}
.card-header h3 { font-size: .95rem; font-weight: 700; }
.card-header span { font-size: .78rem; color: var(--text3); }

/* ═══════════════════════════
   CLOCK WIDGET
═══════════════════════════ */
.clock-widget {
  background: linear-gradient(135deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.clock-widget::before {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(245,158,11,.08), transparent);
  top: -100px; left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
}

.clock-time {
  font-size: 3.5rem;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--primary);
  letter-spacing: -.02em;
  text-shadow: 0 0 40px rgba(245,158,11,.3);
}

.clock-date { font-size: .85rem; color: var(--text3); margin: .25rem 0 1.5rem; }

.clock-status {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: .4rem .9rem;
  font-size: .8rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text3);
}
.status-dot.in  { background: var(--success); box-shadow: 0 0 8px var(--success); }
.status-dot.out { background: var(--danger);  box-shadow: 0 0 8px var(--danger); }

.clock-buttons { display: flex; gap: .75rem; justify-content: center; }
.clock-buttons button { min-width: 120px; }

/* ═══════════════════════════
   TABLE
═══════════════════════════ */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: .85rem;
}
thead th {
  text-align: left;
  padding: .6rem .85rem;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: .75rem .85rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,.02); }

/* ═══════════════════════════
   BADGES / PILLS
═══════════════════════════ */
.pill {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .25rem .65rem;
  border-radius: 99px;
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  white-space: nowrap;
}
.pill.green   { background: rgba(16,185,129,.15); color: var(--success); }
.pill.red     { background: rgba(239,68,68,.15);  color: var(--danger); }
.pill.amber   { background: rgba(245,158,11,.15); color: var(--primary); }
.pill.blue    { background: rgba(59,130,246,.15); color: var(--info); }
.pill.purple  { background: rgba(99,102,241,.15); color: var(--accent); }
.pill.gray    { background: rgba(107,114,128,.15);color: var(--text3); }

/* ═══════════════════════════
   LEAVE FORM & CARDS
═══════════════════════════ */
.leave-cards { display: flex; flex-direction: column; gap: .75rem; }

.leave-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1rem;
  transition: border-color var(--trans);
}
.leave-card:hover { border-color: var(--border2); }

.leave-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: .5rem;
}
.leave-card-name { font-weight: 700; font-size: .9rem; }
.leave-card-type { font-size: .78rem; color: var(--text3); margin-top: .1rem; }
.leave-card-dates { font-size: .8rem; color: var(--text2); margin-bottom: .5rem; }
.leave-card-reason { font-size: .82rem; color: var(--text3); font-style: italic; margin-bottom: .75rem; }
.leave-card-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ═══════════════════════════
   EMPLOYEE LIST
═══════════════════════════ */
.emp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}

.emp-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: .75rem;
  transition: border-color var(--trans), transform var(--trans);
}
.emp-card:hover { border-color: var(--border2); transform: translateY(-2px); }

.emp-card-top { display: flex; align-items: center; gap: .75rem; }

.emp-card-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 700; color: white;
  flex-shrink: 0;
}
.emp-card-name { font-weight: 700; font-size: .95rem; }
.emp-card-pos  { font-size: .78rem; color: var(--text3); }
.emp-card-dept {
  font-size: .72rem; color: var(--accent);
  text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
}

.emp-card-info { font-size: .8rem; color: var(--text3); display: flex; flex-direction: column; gap: .3rem; }
.emp-card-info span { display: flex; align-items: center; gap: .4rem; }
.emp-card-info i { width: 14px; color: var(--text3); }

.emp-card-footer { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }

/* ═══════════════════════════
   MODAL
═══════════════════════════ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
  animation: fadeIn .2s ease;
}

.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 18px;
  width: min(520px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp .25s ease;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 1rem; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1.1rem; padding: .2rem; }
.modal-close:hover { color: var(--text1); }

.modal-body { padding: 1.5rem; }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: .75rem;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border);
}

/* ═══════════════════════════
   SEARCH & FILTER BAR
═══════════════════════════ */
.filter-bar {
  display: flex;
  align-items: center;
  gap: .75rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}

.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-box i { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: .85rem; }
.search-box input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .65rem .85rem .65rem 2.5rem;
  color: var(--text1);
  font-family: var(--font);
  font-size: .875rem;
  outline: none;
  transition: border-color var(--trans);
}
.search-box input:focus { border-color: var(--primary); }

.filter-select {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .65rem .85rem;
  color: var(--text1);
  font-family: var(--font);
  font-size: .875rem;
  outline: none;
  cursor: pointer;
  transition: border-color var(--trans);
}
.filter-select:focus { border-color: var(--primary); }
.filter-select option { background: var(--bg2); }

/* ═══════════════════════════
   DEPT CHART
═══════════════════════════ */
.dept-bars { display: flex; flex-direction: column; gap: .75rem; }

.dept-bar { display: flex; align-items: center; gap: .75rem; }
.dept-label { font-size: .8rem; color: var(--text2); min-width: 100px; }
.dept-track {
  flex: 1;
  height: 8px;
  background: var(--bg3);
  border-radius: 99px;
  overflow: hidden;
}
.dept-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--primary));
  border-radius: 99px;
  transition: width .5s ease;
}
.dept-count { font-size: .8rem; color: var(--text3); font-family: var(--mono); min-width: 24px; text-align: right; }

/* ═══════════════════════════
   PROFILE
═══════════════════════════ */
.profile-header {
  background: linear-gradient(135deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}

.profile-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 700; color: white;
  box-shadow: 0 8px 24px rgba(99,102,241,.4);
  flex-shrink: 0;
}

.profile-name  { font-size: 1.4rem; font-weight: 700; }
.profile-pos   { font-size: .9rem; color: var(--text3); margin: .2rem 0; }
.profile-dept  { font-size: .8rem; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

.profile-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.25rem;
}

.meta-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; }
.meta-label { font-size: .72rem; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: .3rem; }
.meta-val   { font-size: .9rem; font-weight: 600; }

/* ═══════════════════════════
   TOASTS
═══════════════════════════ */
.toast-container {
  position: fixed;
  bottom: 1.5rem; right: 1.5rem;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: .5rem;
}

.toast {
  display: flex; align-items: center; gap: .75rem;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: .8rem 1rem;
  min-width: 260px;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  animation: toastIn .3s ease;
  font-size: .85rem;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error   { border-left: 3px solid var(--danger); }
.toast.info    { border-left: 3px solid var(--info); }
.toast i { font-size: 1rem; flex-shrink: 0; }
.toast.success i { color: var(--success); }
.toast.error   i { color: var(--danger); }
.toast.info    i { color: var(--info); }

@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* ═══════════════════════════
   LOADER
═══════════════════════════ */
.loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem;
  gap: 1rem;
  color: var(--text3);
  font-size: .85rem;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border2);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════
   EMPTY STATE
═══════════════════════════ */
.empty-state {
  text-align: center;
  padding: 3rem 2rem;
  color: var(--text3);
}
.empty-state i { font-size: 2.5rem; opacity: .3; margin-bottom: .75rem; display: block; }
.empty-state p  { font-size: .9rem; }

/* ═══════════════════════════
   FORM ROW
═══════════════════════════ */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

/* ═══════════════════════════
   RESPONSIVE
═══════════════════════════ */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    transform: translateX(-100%);
    height: 100%;
    z-index: 200;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-close { display: flex; align-items: center; justify-content: center; }
  .sidebar-overlay.active { display: block; }

  .hamburger { display: flex; }
  .main-content { width: 100%; }

  .content-area { padding: 1rem; }

  .two-col, .three-col { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }

  .stats-grid { grid-template-columns: 1fr 1fr; }

  .page-header { flex-direction: column; align-items: flex-start; }

  .topbar-date { display: none; }

  .emp-grid { grid-template-columns: 1fr; }

  .clock-time { font-size: 2.5rem; }
}

@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr; }
  .login-card { padding: 1.75rem 1.5rem; }
}
